packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

allowBuilds:
  electron: true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Versão única de dependências-chave em todo o monorepo (D1 do plano:
# uma só SPA, um só motor de domínio — não faz sentido ter React ou
# TypeScript divergindo entre kiosk-ui, backoffice e ui).
catalog:
  react: ^19.0.0
  react-dom: ^19.0.0
  typescript: ^5.7.0
  vitest: ^2.1.0
  zod: ^3.24.0
  eslint: ^9.17.0

# Correção da auditoria de 2026-08-10 (item 9): js-yaml@3.14.1 chega
# transitivamente via xmlbuilder2 (packages/fiscal) com 2 CVEs (DoS
# quadrático em merge-key/!!omap). Força a versão corrigida em toda a
# árvore de dependências.
overrides:
  js-yaml@<3.15.1: ^3.15.1
