<!-- @dsCard group="App" viewport="390x844" name="FaçaAmigos App" subtitle="Interactive mobile prototype — home + 4 category screens" --><!-- @startingPoint section="App" subtitle="FaçaAmigos mobile app prototype" viewport="390x844" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <link rel="stylesheet" href="../../styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #141414; width: 390px; min-height: 844px; overflow-x: hidden; font-family: 'Nunito', sans-serif; }
    @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .screen-enter { animation: slideIn 220ms ease forwards; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">

    /* ── Inlined design-system components ── */

    function Button({ variant='primary', size='md', disabled=false, fullWidth=false, children, onClick, style: sp }) {
      const [hov, setHov] = React.useState(false);
      const [prs, setPrs] = React.useState(false);
      const sz = { sm:{padding:'8px 20px',fontSize:'14px'}, md:{padding:'12px 28px',fontSize:'16px'}, lg:{padding:'15px 36px',fontSize:'18px'} }[size];
      const va = {
        primary: { background: hov ? '#C8155A' : '#F0196B', color:'#fff', border:'none', boxShadow: hov ? '0 4px 20px rgba(240,25,107,0.35)' : 'none' },
        teal:    { background: hov ? '#26B09B' : '#2ECFB5', color:'#fff', border:'none', boxShadow: hov ? '0 4px 20px rgba(46,207,181,0.3)' : 'none' },
        secondary:{ background:'transparent', color:'#F0196B', border:'2px solid #F0196B', boxShadow:'none' },
        ghost:   { background: hov ? 'rgba(240,25,107,0.10)' : 'transparent', color:'#F0196B', border:'none', boxShadow:'none' },
      }[variant] || {};
      return (
        <button disabled={disabled} onClick={!disabled?onClick:undefined}
          onMouseEnter={()=>setHov(true)} onMouseLeave={()=>{setHov(false);setPrs(false);}}
          onMouseDown={()=>setPrs(true)} onMouseUp={()=>setPrs(false)}
          style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:'8px',borderRadius:'9999px',fontFamily:'Nunito,sans-serif',fontWeight:800,cursor:disabled?'not-allowed':'pointer',opacity:disabled?0.45:1,transition:'all 150ms ease',transform:prs?'scale(0.96)':hov?'scale(1.02)':'scale(1)',outline:'none',width:fullWidth?'100%':'auto',...sz,...va,...sp}}>
          {children}
        </button>
      );
    }

    function CircleButton({ color='#F05870', label, size=88, onClick, style: sp }) {
      const [prs, setPrs] = React.useState(false);
      const outer = size + 12;
      const ring = 'conic-gradient(from 200deg,#A020EE 0%,#F0196B 20%,#FF7A00 50%,#FFD700 75%,#FF7A00 85%,#F0196B 95%,#A020EE 100%)';
      return (
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:10,cursor:onClick?'pointer':'default',...sp}}
          onClick={onClick} onMouseDown={()=>setPrs(true)} onMouseUp={()=>setPrs(false)} onMouseLeave={()=>setPrs(false)}>
          <div style={{width:outer,height:outer,borderRadius:'50%',background:ring,display:'flex',alignItems:'center',justifyContent:'center',padding:'3px',transform:prs?'scale(0.93)':'scale(1)',transition:'transform 200ms cubic-bezier(0.34,1.56,0.64,1)'}}>
            <div style={{width:outer-6,height:outer-6,borderRadius:'50%',background:'#141414',display:'flex',alignItems:'center',justifyContent:'center',padding:'3px'}}>
              <div style={{width:size,height:size,borderRadius:'50%',background:color}} />
            </div>
          </div>
          {label && <span style={{fontFamily:'Nunito,sans-serif',fontWeight:600,fontSize:14,color:'#fff',textAlign:'center',lineHeight:1.2}}>{label}</span>}
        </div>
      );
    }

    function Badge({ variant='pink', children }) {
      const v = {
        pink:    {background:'rgba(240,25,107,0.15)',color:'#F0196B',border:'1px solid rgba(240,25,107,0.3)'},
        teal:    {background:'rgba(46,207,181,0.15)', color:'#2ECFB5',border:'1px solid rgba(46,207,181,0.3)'},

        neutral: {background:'rgba(255,255,255,0.08)',color:'rgba(255,255,255,0.6)',border:'1px solid rgba(255,255,255,0.12)'},
      }[variant]||{};
      return <span style={{display:'inline-flex',alignItems:'center',padding:'4px 10px',borderRadius:'9999px',fontFamily:'Nunito,sans-serif',fontWeight:600,fontSize:12,lineHeight:1,...v}}>{children}</span>;
    }

    /* ── Status Bar ── */
    function StatusBar() {
      return (
        <div style={{height:44,padding:'0 24px',display:'flex',alignItems:'center',justifyContent:'space-between',background:'#141414'}}>
          <span style={{fontSize:15,fontWeight:700,color:'#fff'}}>9:41</span>
          <div style={{display:'flex',gap:5,alignItems:'center'}}>
            <svg width="17" height="12" viewBox="0 0 17 12" fill="white" opacity=".9"><rect x="0" y="4" width="3" height="8" rx="1"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1"/><rect x="9" y="0.5" width="3" height="11.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
            <svg width="17" height="12" viewBox="0 0 17 12" fill="white" opacity=".9"><path d="M8.5 3C11 3 13.2 4.1 14.7 5.8L16 4.5C14.1 2.4 11.4 1.2 8.5 1.2S2.9 2.4 1 4.5L2.3 5.8C3.8 4.1 6 3 8.5 3Z" opacity=".5"/><path d="M8.5 6C10.1 6 11.5 6.7 12.5 7.8L13.8 6.5C12.5 5.1 10.6 4.2 8.5 4.2S4.5 5.1 3.2 6.5L4.5 7.8C5.5 6.7 6.9 6 8.5 6Z"/><circle cx="8.5" cy="10.5" r="1.5"/></svg>
            <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="white" strokeOpacity=".35"/><rect x="1.5" y="1.5" width="19" height="10" rx="2.5" fill="white"/><path d="M24.5 5v3c.9-.4 1.4-1 1.4-1.5S25.4 5.4 24.5 5Z" fill="white" opacity=".4"/></svg>
          </div>
        </div>
      );
    }

    function Header({ title, onBack, color='#FFFFFF' }) {
      return (
        <div style={{height:56,padding:'0 20px',display:'flex',alignItems:'center',gap:14,background:'#141414'}}>
          <button onClick={onBack} style={{background:'rgba(255,255,255,0.09)',border:'none',borderRadius:'50%',width:36,height:36,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:22,flexShrink:0,lineHeight:1}}>‹</button>
          <span style={{fontFamily:'Fredoka One,cursive',fontSize:26,color,lineHeight:1}}>{title}</span>
        </div>
      );
    }

    /* ── Screens ── */

    function HomeScreen({ onNavigate }) {
      return (
        <div className="screen-enter" style={{background:'#141414',minHeight:844,display:'flex',flexDirection:'column'}}>
          <StatusBar />
          <div style={{padding:'20px 24px 8px'}}>
            <img src="../../assets/Logo.jpg" alt="FaçaAmigos" style={{height:52,objectFit:'contain',objectPosition:'left'}} />
          </div>
          <div style={{padding:'14px 24px 0'}}>
            <p style={{fontFamily:'Fredoka One,cursive',fontSize:30,color:'#fff',lineHeight:1.1}}>Olá! O que você</p>
            <p style={{fontFamily:'Fredoka One,cursive',fontSize:30,color:'#F0196B',lineHeight:1.1}}>procura hoje?</p>
            <p style={{fontSize:13,color:'rgba(255,255,255,0.4)',marginTop:8}}>Selecione uma categoria</p>
          </div>
          <div style={{margin:'22px 0 0',height:148,position:'relative',overflow:'hidden'}}>
            <img src="../../assets/marketing-curta.jpeg" alt="" style={{width:'100%',height:'100%',objectFit:'cover',opacity:0.28}} />
            <div style={{position:'absolute',inset:0,background:'linear-gradient(to bottom,#141414 0%,transparent 35%,transparent 65%,#141414 100%)'}} />
          </div>
          <div style={{flex:1,padding:'28px 8px 0',display:'flex',justifyContent:'space-around',alignItems:'flex-start'}}>
            <CircleButton color="#F05870" label="Horários"    size={78} onClick={() => onNavigate('horarios')} />
            <CircleButton color="#2ECFB5" label="Dúvidas"     size={78} onClick={() => onNavigate('duvidas')} />
            <CircleButton color="#FFFFFF" label="Inclusão"    size={78} onClick={() => onNavigate('inclusao')} />
            <CircleButton color="#FFE234" label="Localização" size={78} onClick={() => onNavigate('localizacao')} />
          </div>
          <div style={{height:52}} />
        </div>
      );
    }

    function HorariosScreen({ onBack }) {
      const days = [
        ['Segunda','10h – 22h'],['Terça','10h – 22h'],['Quarta','10h – 22h'],
        ['Quinta','10h – 22h'],['Sexta','10h – 22h'],
        ['Sábado','10h – 22h'],['Domingo','10h – 22h'],
      ];
      return (
        <div className="screen-enter" style={{background:'#141414',minHeight:844}}>
          <StatusBar />
          <Header title="Horários" color="#FFE234" onBack={onBack} />
          <div style={{padding:'4px 24px 40px'}}>
            <p style={{fontFamily:'Fredoka One,cursive',fontSize:44,color:'#FFE234',lineHeight:1,marginBottom:4}}>das 10h às 22h</p>
            <p style={{fontSize:14,color:'rgba(255,255,255,0.45)',marginBottom:28}}>te esperando todos os dias!</p>
            {days.map(([d,h]) => (
              <div key={d} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'14px 0',borderBottom:'1px solid rgba(255,255,255,0.07)'}}>
                <span style={{fontWeight:600,fontSize:16,color:'#fff'}}>{d}</span>
                <span style={{fontWeight:800,fontSize:16,color:'#FFE234'}}>{h}</span>
              </div>
            ))}
            <div style={{marginTop:28,background:'#262626',borderRadius:20,padding:'20px'}}>
              <p style={{fontFamily:'Fredoka One,cursive',fontSize:18,color:'#F0196B',marginBottom:6}}>Atenção!</p>
              <p style={{fontSize:14,color:'rgba(255,255,255,0.6)',lineHeight:1.65}}>Horários podem variar em feriados. Siga nossas redes sociais para atualizações em tempo real.</p>
            </div>
          </div>
        </div>
      );
    }

    function DuvidasScreen({ onBack }) {
      const [open, setOpen] = React.useState(null);
      const faqs = [
        ['Qual a faixa etária atendida?','Atendemos crianças de 1 a 12 anos, com áreas adaptadas para cada faixa etária.'],
        ['Adultos precisam pagar?','Acompanhantes adultos têm entrada gratuita. Somente as crianças pagam a entrada.'],
        ['O espaço é seguro?','Todo o espaço é projetado com materiais certificados e monitorado por equipe treinada.'],
        ['Aceitam festas de aniversário?','Sim! Temos pacotes especiais. Entre em contato para saber mais.'],
        ['O espaço é acessível?','Somos Playground Inclusivo! Rampas, banheiros adaptados e brinquedos para todas as habilidades.'],
      ];
      return (
        <div className="screen-enter" style={{background:'#141414',minHeight:844}}>
          <StatusBar />
          <Header title="Dúvidas" color="#2ECFB5" onBack={onBack} />
          <div style={{padding:'4px 24px 40px'}}>
            <p style={{fontSize:13,color:'rgba(255,255,255,0.4)',marginBottom:20}}>Perguntas frequentes</p>
            {faqs.map(([q,a],i) => (
              <div key={i} style={{background:'#262626',borderRadius:16,marginBottom:10,overflow:'hidden'}}>
                <button onClick={() => setOpen(open===i?null:i)} style={{width:'100%',padding:'16px 18px',background:'transparent',border:'none',cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center',gap:12}}>
                  <span style={{fontWeight:700,fontSize:14,color:'#fff',textAlign:'left',lineHeight:1.35,fontFamily:'Nunito,sans-serif'}}>{q}</span>
                  <span style={{color:'#2ECFB5',fontSize:22,flexShrink:0,transition:'transform 200ms ease',display:'block',transform:open===i?'rotate(45deg)':'none'}}>+</span>
                </button>
                {open===i && <div style={{padding:'0 18px 16px'}}><p style={{fontSize:14,color:'rgba(255,255,255,0.6)',lineHeight:1.65}}>{a}</p></div>}
              </div>
            ))}
          </div>
        </div>
      );
    }

    function InclusaoScreen({ onBack }) {
      const features = [
        ['Rampas de acesso','#2ECFB5'],['Brinquedos adaptados','#F0196B'],
        ['Banheiros acessíveis','#2ECFB5'],['Equipe especializada','#C99020'],
        ['Sinalização visual','#FFE234'],['Espaço sensorial','#F0196B'],
      ];
      return (
        <div className="screen-enter" style={{background:'#141414',minHeight:844}}>
          <StatusBar />
          <Header title="Inclusão" color="#FFFFFF" onBack={onBack} />
          <div style={{padding:'4px 24px 40px'}}>
            <p style={{fontFamily:'Fredoka One,cursive',fontSize:28,color:'#fff',lineHeight:1.1}}>Um espaço para</p>
            <p style={{fontFamily:'Fredoka One,cursive',fontSize:28,color:'#F0196B',lineHeight:1.1,marginBottom:14}}>todas as crianças</p>
            <p style={{fontSize:14,color:'rgba(255,255,255,0.55)',lineHeight:1.65,marginBottom:26}}>O FaçaAmigos é pensado para crianças com e sem deficiência brincarem juntas, com segurança e alegria.</p>
            <p style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,0.3)',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:14}}>Recursos de acessibilidade</p>
            <div style={{display:'flex',flexWrap:'wrap',gap:10,marginBottom:28}}>
              {features.map(([label,color]) => (
                <div key={label} style={{background:'#262626',borderRadius:12,padding:'12px 16px',display:'flex',alignItems:'center',gap:10}}>
                  <div style={{width:8,height:8,borderRadius:'50%',background:color,flexShrink:0}} />
                  <span style={{fontWeight:600,fontSize:14,color:'#fff'}}>{label}</span>
                </div>
              ))}
            </div>
            <div style={{background:'linear-gradient(135deg,rgba(240,25,107,0.12) 0%,rgba(46,207,181,0.12) 100%)',borderRadius:20,padding:'20px',border:'1px solid rgba(255,255,255,0.07)'}}>
              <p style={{fontFamily:'Fredoka One,cursive',fontSize:18,color:'#fff',marginBottom:6}}>Quer saber mais?</p>
              <p style={{fontSize:13,color:'rgba(255,255,255,0.55)',lineHeight:1.5,marginBottom:16}}>Entre em contato para tirar dúvidas sobre acessibilidade.</p>
              <Button variant="primary" size="sm">Falar conosco</Button>
            </div>
          </div>
        </div>
      );
    }

    function LocalizacaoScreen({ onBack }) {
      const transport = [
        ['🚗','Estacionamento','Gratuito para clientes'],
        ['🚌','Ônibus','Linhas 123, 456 e 789'],
        ['🚇','Metrô','Estação Alegre — 5 min a pé'],
      ];
      return (
        <div className="screen-enter" style={{background:'#141414',minHeight:844}}>
          <StatusBar />
          <Header title="Localização" color="#C99020" onBack={onBack} />
          <div style={{padding:'4px 24px 40px'}}>
            <div style={{background:'#262626',borderRadius:20,height:190,marginBottom:20,display:'flex',alignItems:'center',justifyContent:'center',border:'1px solid rgba(255,255,255,0.05)',position:'relative',overflow:'hidden'}}>
              <div style={{position:'absolute',inset:0,background:'linear-gradient(135deg,rgba(46,207,181,0.12),rgba(240,25,107,0.12))'}} />
              <div style={{textAlign:'center',position:'relative'}}>
                <div style={{fontSize:44,marginBottom:6}}>📍</div>
                <p style={{fontSize:12,color:'rgba(255,255,255,0.3)'}}>Visualização do mapa</p>
              </div>
            </div>
            <div style={{background:'#262626',borderRadius:20,padding:'20px',marginBottom:14}}>
              <p style={{fontFamily:'Fredoka One,cursive',fontSize:20,color:'#FFE234',marginBottom:6}}>Endereço</p>
              <p style={{fontWeight:700,fontSize:16,color:'#fff',lineHeight:1.4,marginBottom:4}}>Rua das Brincadeiras, 123</p>
              <p style={{fontSize:14,color:'rgba(255,255,255,0.5)'}}>Bairro Alegre, São Paulo – SP</p>
            </div>
            {transport.map(([icon,title,sub]) => (
              <div key={title} style={{background:'#262626',borderRadius:14,padding:'14px 16px',marginBottom:10,display:'flex',alignItems:'center',gap:14}}>
                <span style={{fontSize:24,flexShrink:0}}>{icon}</span>
                <div>
                  <p style={{fontWeight:700,fontSize:14,color:'#fff'}}>{title}</p>
                  <p style={{fontSize:13,color:'rgba(255,255,255,0.45)'}}>{sub}</p>
                </div>
              </div>
            ))}
            <div style={{marginTop:16}}>
              <Button variant="teal" fullWidth>Abrir no Google Maps</Button>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [screen, setScreen] = React.useState('home');
      const go = s => setScreen(s);
      if (screen === 'home')        return <HomeScreen      onNavigate={go} />;
      if (screen === 'horarios')    return <HorariosScreen  onBack={() => go('home')} />;
      if (screen === 'duvidas')     return <DuvidasScreen   onBack={() => go('home')} />;
      if (screen === 'inclusao')    return <InclusaoScreen  onBack={() => go('home')} />;
      if (screen === 'localizacao') return <LocalizacaoScreen onBack={() => go('home')} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
