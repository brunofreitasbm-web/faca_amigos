<!-- @dsCard group="Type" viewport="700x220" name="Display — Fredoka One" subtitle="Bubbly headline font used in marketing materials" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #141414; padding: 20px 24px; }
    .row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
    .specimen { font-family: var(--font-display); line-height: 1.05; }
    .meta { font-family: var(--font-body); font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.3); letter-spacing: 0.06em; white-space: nowrap; min-width: 60px; }
  </style>
</head>
<body>
  <div class="row">
    <span class="meta">80px</span>
    <span class="specimen" style="font-size:80px; color:var(--color-yellow)">Horários</span>
  </div>
  <div class="row">
    <span class="meta">48px</span>
    <span class="specimen" style="font-size:48px; color:var(--color-pink)">Curta sem Preocupação</span>
  </div>
  <div class="row">
    <span class="meta">30px</span>
    <span class="specimen" style="font-size:30px; color:var(--color-teal)">te esperando todos os dias!</span>
  </div>
  <div class="row">
    <span class="meta">20px</span>
    <span class="specimen" style="font-size:20px; color:#fff">Mais tempo para brincar e se divertir</span>
  </div>
</body>
</html>
