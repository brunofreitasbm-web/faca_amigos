<!-- @dsCard group="Colors" viewport="700x120" name="Neutral Scale" subtitle="Gray 100–900" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #fff; padding: 20px; font-family: var(--font-body); }
    .swatches { display: flex; gap: 6px; }
    .swatch { flex: 1; border-radius: 8px; height: 52px; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 7px; }
    .label { font-size: 9px; font-weight: 600; letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <div class="swatches">
    <div class="swatch" style="background:var(--color-gray-100)"><span class="label" style="color:#aaa">100</span></div>
    <div class="swatch" style="background:var(--color-gray-200)"><span class="label" style="color:#999">200</span></div>
    <div class="swatch" style="background:var(--color-gray-300)"><span class="label" style="color:#888">300</span></div>
    <div class="swatch" style="background:var(--color-gray-400)"><span class="label" style="color:#666">400</span></div>
    <div class="swatch" style="background:var(--color-gray-500)"><span class="label" style="color:#fff;opacity:.7">500</span></div>
    <div class="swatch" style="background:var(--color-gray-600)"><span class="label" style="color:#fff;opacity:.7">600</span></div>
    <div class="swatch" style="background:var(--color-gray-700)"><span class="label" style="color:#fff;opacity:.7">700</span></div>
    <div class="swatch" style="background:var(--color-gray-800)"><span class="label" style="color:#fff;opacity:.6">800</span></div>
    <div class="swatch" style="background:var(--color-gray-900)"><span class="label" style="color:#fff;opacity:.5">900</span></div>
  </div>
</body>
</html>
