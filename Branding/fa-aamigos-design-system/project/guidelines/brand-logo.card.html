<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 180px; }
    .panel { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .logo { height: 70px; width: auto; object-fit: contain; }
  </style>
</head>
<body style="background-color: rgba(255, 255, 255, 0)">
  <div class="panel" style="background:#F5F6F7">
    <img class="logo" src="../assets/Logo.png" alt="FaçaAmigos — Playground Inclusivo" />
  </div>
  <div class="panel" style="background:var(--color-bg-app)">
    <img class="logo" src="../assets/Logo.png" alt="FaçaAmigos — Playground Inclusivo" />
  </div>
</body>
</html>
