<!-- @dsCard group="Type" viewport="700x220" name="Body — Nunito" subtitle="Clean rounded sans-serif for UI text and body copy" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #141414; padding: 20px 24px; }
    .row { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; }
    .meta { font-family: var(--font-body); font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.3); letter-spacing: 0.06em; min-width: 88px; }
    .specimen { font-family: var(--font-body); color: #fff; }
  </style>
</head>
<body>
  <div class="row">
    <span class="meta">24px / 900</span>
    <span class="specimen" style="font-size:24px; font-weight:900">FaçaAmigos Playground</span>
  </div>
  <div class="row">
    <span class="meta">20px / 800</span>
    <span class="specimen" style="font-size:20px; font-weight:800">Área de Brincar Inclusiva</span>
  </div>
  <div class="row">
    <span class="meta">16px / 700</span>
    <span class="specimen" style="font-size:16px; font-weight:700">Horários: das 10h às 22h, todos os dias</span>
  </div>
  <div class="row">
    <span class="meta">16px / 400</span>
    <span class="specimen" style="font-size:16px; font-weight:400; color:rgba(255,255,255,0.75)">Você curte e a gente cuida da diversão da criançada.</span>
  </div>
  <div class="row">
    <span class="meta">13px / 600</span>
    <span class="specimen" style="font-size:13px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:rgba(255,255,255,0.45)">PLAYGROUND INCLUSIVO</span>
  </div>
  <div class="row">
    <span class="meta">12px / 400</span>
    <span class="specimen" style="font-size:12px; font-weight:400; color:rgba(255,255,255,0.4)">Mais tempo para brincar e se divertir com segurança.</span>
  </div>
</body>
</html>
