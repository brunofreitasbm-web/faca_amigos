<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaçaAmigos — Protótipo do Sistema (Fase 0)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <div id="offline-banner" class="banner-offline">SEM SERVIDOR — sem entrada até religar (banner simulado)</div>

    <header class="topbar">
      <div class="brand">
        <img src="../packages/ui/src/assets/logo.png" alt="FaçaAmigos" />
      </div>

      <div class="unit-switch" id="unit-switch">
        <button data-unit="LOJA">Loja (Playground)</button>
        <button data-unit="QUIOSQUE">Quiosque (Circuito)</button>
      </div>

      <!-- Os botões desta nav são gerados por render() em app.js (lista NAV_ITEMS),
           porque "Frota" só aparece quando a unidade atual é o Quiosque. -->
      <nav class="nav-tabs" id="nav-tabs"></nav>

      <button class="btn btn-ghost btn-sm" style="border:1px solid var(--border-subtle)" onclick="toggleOffline()" title="Simula o servidor local caindo">
        📶 Simular queda de servidor
      </button>
    </header>

    <main id="screen" class="screen"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
