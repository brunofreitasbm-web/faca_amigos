<style>
:root{
  --pink:#F0196B; --pink-ink:#C8155A; --teal:#2ECFB5; --teal-ink:#1D8273;
  --amber:#C99020; --amber-ink:#996D18; --yellow:#FFE234; --orange:#FF7A00;
  --dark:#1A3F35; --ink:#3A4149; --muted:#5A636E; --soft:#6C7682;
  --line:#E8EAEC; --line-2:#CDD1D6; --bg:#F5F6F7; --card:#FFFFFF;
  --green:#28C880; --green-ink:#1A8454; --red:#E61E1E;
  --gradient-ring:conic-gradient(from 200deg,#A020EE 0%,#F0196B 20%,#FF7A00 50%,#FFD700 75%,#FF7A00 85%,#F0196B 95%,#A020EE 100%);
  --gradient-brand:linear-gradient(135deg,#F0196B 0%,#FF7A00 50%,#FFE234 100%);
  --color-bg-app:#FFFFFF;
  --r-card:24px; --r-pill:9999px;
  --pad-t:env(safe-area-inset-top,0px);
  --pad-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0}
body{
  background:#DFE3E6;
  font-family:'Nunito',system-ui,-apple-system,sans-serif;
  color:var(--dark);
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme:dark){body{background:#20262B}}

/* ---- shell: full-bleed no celular, coluna centrada no tablet/desktop ---- */
#shell{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
}
#app{
  position:relative;width:100%;height:100%;max-width:100%;
  background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
}
@media (min-width:700px){
  #shell{padding:24px}
  #app{
    max-width:430px;height:min(100%,920px);
    border-radius:34px;box-shadow:0 18px 60px rgba(0,0,0,.28);
    border:1px solid rgba(0,0,0,.10);
  }
}

/* ---- barra de status ---- */
.statusbar{
  flex:none;background:#fff;padding-top:var(--pad-t);
  height:calc(40px + var(--pad-t));
  display:flex;align-items:center;justify-content:space-between;padding-left:24px;padding-right:24px;
}
.statusbar b{font:800 15px 'Nunito',sans-serif;color:var(--dark)}
.statusbar span{font:600 12px 'Nunito',sans-serif;color:var(--soft)}

/* ---- corpo rolável ---- */
.body{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:0;height:0}

/* ---- tipografia ---- */
.h1{margin:0;font-family:'Fredoka One',cursive;font-size:25px;line-height:1.2;color:var(--dark)}
.h2{margin:0;font-family:'Fredoka One',cursive;font-size:21px;line-height:1.2;color:var(--dark)}
.eyebrow{margin:0;font:800 11.5px 'Nunito',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.sub{margin:0;font:600 13px 'Nunito',sans-serif;color:var(--soft)}

/* ---- topo de página ---- */
.appbar{
  flex:none;background:#fff;border-bottom:1px solid var(--line);
  padding:10px 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.navbar{
  flex:none;height:56px;padding:0 16px;display:flex;align-items:center;gap:12px;
  background:#fff;border-bottom:1px solid var(--line);
}
.back{
  width:40px;height:40px;border:none;border-radius:50%;background:var(--bg);
  color:var(--dark);font-size:22px;line-height:1;flex:none;cursor:pointer;
}
.avatar{
  width:44px;height:44px;border-radius:50%;background:var(--bg);display:flex;
  align-items:center;justify-content:center;font:800 15px 'Nunito',sans-serif;color:var(--teal-ink);flex:none;
}

/* ---- cartões / controles ---- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:16px 18px}
.tap{cursor:pointer;transition:transform 120ms ease, box-shadow 160ms ease;user-select:none}
.tap:active{transform:scale(.975)}
@media (hover:hover){.tap:hover{box-shadow:0 4px 16px rgba(0,0,0,.10)}}
.cta{
  display:block;width:100%;border:none;border-radius:var(--r-pill);padding:17px;
  font-family:'Fredoka One',cursive;font-size:19px;line-height:1.2;cursor:pointer;
}
.pill{border-radius:var(--r-pill);padding:14px;text-align:center;font:800 14px 'Nunito',sans-serif;
  background:var(--bg);border:1px solid var(--line);color:var(--dark);cursor:pointer}
.input{
  width:100%;background:transparent;border:none;outline:none;
  font:600 16px 'Nunito',sans-serif;color:var(--dark);min-width:0;
}
.field{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;
  font:600 15px 'Nunito',sans-serif;color:var(--dark)}
.flabel{margin:0 0 6px;font:800 12px 'Nunito',sans-serif;color:var(--dark)}

/* ---- tab bar ---- */
.tabbar{
  flex:none;display:flex;background:#fff;border-top:1px solid var(--line);
  padding:10px 8px calc(14px + var(--pad-b));
}
.tabbar button{
  flex:1;background:none;border:none;padding:6px 2px;cursor:pointer;
  font:600 12px 'Nunito',sans-serif;color:var(--soft);
}
.tabbar button.on{font-weight:800;color:var(--pink-ink)}

/* ---- círculos da marca (CircleButton do DS) ---- */
.ring{
  width:90px;height:90px;border-radius:50%;background:var(--gradient-ring);
  display:flex;align-items:center;justify-content:center;padding:3px;flex:none;
}
.ring>i{width:82px;height:82px;border-radius:50%;background:var(--color-bg-app);
  display:flex;align-items:center;justify-content:center;padding:3px}
.ring>i>i{width:76px;height:76px;border-radius:50%;display:block}

@keyframes fa-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.pulse{animation:fa-pulse 1.6s infinite}

/* ---- bottom sheet ---- */
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
  border-radius:28px 28px 0 0;padding:20px 20px calc(26px + var(--pad-b));
  box-shadow:0 -16px 48px rgba(0,0,0,.16);animation:sheet-up 220ms cubic-bezier(.34,1.3,.64,1);
}
@keyframes sheet-up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* a interface é deliberadamente light-only (o design é "light mode em tudo");
   só o fundo fora da coluna do app acompanha o tema do visualizador. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
button:focus-visible,[data-a]:focus-visible,input:focus-visible{outline:3px solid #C8155A;outline-offset:2px;border-radius:12px}
.toast{
  position:absolute;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--pad-b));
  background:var(--dark);color:#fff;font:800 13px 'Nunito',sans-serif;
  padding:12px 18px;border-radius:9999px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.28);
  animation:sheet-up 200ms ease;
}
</style>

/* ===== utils ===== */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function secs(){ return String((60-Math.floor((S.now/1000)%60))%60).padStart(2,"0"); }
function clockNow(){ var d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function go(name){ S.stack.push(name); render(); }
function back(){ if(S.stack.length>1){S.stack.pop();} render(); }
function setTab(t){ S.tab=t; S.stack=[({turno:"home",painel:"painel",gerencial:"gerencial",mais:"mais"})[t]]; render(); }
function current(){ return S.stack[S.stack.length-1]; }
function resetCheckin(){ S.step="busca"; S.picked=null; S.plan=null; S.query=""; }

    };
  });
}

/* ===== router ===== */
var SCREENS={
  home:scHome, circulos:scCirculos, checkin:scCheckin, painel:scPainel,
  responsavel:scResponsavel, gerencial:scGerencial, cadastro:scCadastro,
  planos2d:scPlanos, mais:scMais, sobre:scSobre
};

var root=document.getElementById("app");
var LAST_SCREEN=null;
function render(){
  var name=current();
  var fn=SCREENS[name]||scHome;
  var focusEl=document.activeElement;
  var keepFocus = focusEl && focusEl.id==="q";
  var caret = keepFocus ? focusEl.selectionStart : null;
  var prev=root.querySelector(".scroll");
  var scrollTop = (prev && name===LAST_SCREEN) ? prev.scrollTop : 0;

  root.innerHTML = fn() + (S.toast? '<div class="toast">'+esc(S.toast)+'</div>' : '');
  LAST_SCREEN=name;
  var sc=root.querySelector(".scroll");
  if(sc && scrollTop) sc.scrollTop=scrollTop;

  var q=document.getElementById("q");
  if(q){
    q.addEventListener("input",function(e){ S.query=e.target.value; render(); });
    if(keepFocus){ q.focus(); try{ q.setSelectionRange(caret,caret); }catch(err){} }
  }
}

root.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");
  if(!el) return;
  var a=el.getAttribute("data-a");
  var i=a.indexOf(":");
  var cmd = i<0 ? a : a.slice(0,i);
  var arg = i<0 ? null : a.slice(i+1);

  switch(cmd){
    case "back": back(); break;
    case "tab": setTab(arg); break;
    case "tab-painel": setTab("painel"); break;
    case "tab-gerencial": setTab("gerencial"); break;
    case "go": go(arg); break;
    case "nova-entrada": resetCheckin(); go("checkin"); break;
    case "pick-child": S.picked=CHILDREN[+arg]; S.step="plano"; render(); break;
    case "pick-plan": S.plan=PLAN_LIST[+arg].name; render(); break;
    case "confirm-checkin": if(S.plan){ S.step="pronto"; render(); } else { toast("Escolha um plano para continuar"); } break;
    case "reset-checkin": resetCheckin(); render(); break;
    case "select-session": S.selected=+arg; render(); break;
    case "clear-session": S.selected=null; render(); break;
    case "toggle-aviso": S.aviso=!S.aviso; render(); break;
    case "pick-renew": S.renew=+arg; render(); break;
    case "toggle-nd": S.nd=!S.nd; render(); break;
    case "toggle-tag": {
      var t=SENSORY[+arg];
      var k=S.tags.indexOf(t);
      if(k>=0) S.tags.splice(k,1); else S.tags.push(t);
      render(); break;
    }
    case "cad-tab": S.cadTab=arg; S.offer=null; render(); break;
    case "pick-offer": {
      var o=(OFFER_SETS[S.cadTab]||[])[+arg];
      if(o && !o.disabled){ S.offer=o.name; render(); }
      break;
    }
    case "confirm-offer": {
      var list=OFFER_SETS[S.cadTab]||[];
      var ch=list.filter(function(x){return x.name===S.offer;})[0];
      if(!ch){ toast("Escolha uma opção"); break; }
      S.picked=S.picked||{name:"Helena Braga Correia",initials:"HB",detail:"6 anos · resp. Camila Braga Correia",care:"Cuidados marcados no cadastro"};
      S.plan=ch.name; S.step="pronto";
      S.stack=["home","checkin"]; render(); break;
    }
    case "msg": toast(el.getAttribute("data-msg")||""); break;
  }
});

/* voltar do Android / gesto de voltar */
window.addEventListener("popstate",function(){ if(S.stack.length>1){ back(); history.pushState(null,"",location.href); } });
try{ history.pushState(null,"",location.href); }catch(err){}

setInterval(function(){ S.now=Date.now(); if(["painel","responsavel"].indexOf(current())>=0) render(); },1000);

render();
})();
</script>
