# Instalador Windows one-click (NSIS). Fluxo completo: `pnpm dist:kiosk`
# na raiz (builda workspace + ícones + kiosk-ui antes de empacotar).
appId: br.com.facaamigos.kiosk
productName: FacaAmigos
publish:
  provider: generic
  url: https://update.institutofacaamigos.com.br/kiosk
extraMetadata:
  description: FaçaAmigos - AppGestão
directories:
  output: release
  buildResources: build
files:
  - bundle/**
  - package.json
asar: true
npmRebuild: false
extraResources:
  # SPA servida pelo Fastify local (ver src/server/staticSpa.ts)
  - from: ../kiosk-ui/dist
    to: kiosk-ui
  # Migrations .sql lidas em runtime (ver packages/db-local/src/migrate.ts)
  - from: ../../packages/db-local/dist/migrations
    to: migrations
  # Arquivo de configuração .env para o quiosque
  - from: .env
    to: .env

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: FacaAmigos-Setup-${version}.${ext}
nsis:
  oneClick: true
  # perMachine + elevação: necessário para o installer.nsh abrir a porta
  # 7317 no firewall (acesso LAN aos tablets) — custa um prompt de UAC.
  perMachine: true
  allowElevation: true
  runAfterFinish: true
  # "always" (não só "true"): "true" só cria o atalho na instalação
  # inicial — nas reinstalações silenciosas do auto-updater ele não é
  # recriado se sumir. Como o quiosque atualiza sozinho sem ninguém
  # conferindo, "always" garante que o atalho da área de trabalho nunca
  # fique perdido. createStartMenuShortcut não aceita "always" nesta
  # versão do electron-builder (só boolean) — fica true.
  createDesktopShortcut: always
  createStartMenuShortcut: true
  include: build/installer.nsh
