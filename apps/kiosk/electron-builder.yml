# Instalador Windows one-click (NSIS). Fluxo completo: `pnpm dist:kiosk`
# na raiz (builda workspace + ícones + kiosk-ui antes de empacotar).
appId: br.com.facaamigos.kiosk
productName: FacaAmigos
publish:
  provider: generic
  # Bucket público "kiosk-updates" no Supabase Storage (ver scripts/release-kiosk.mjs).
  # Trocado do Vercel porque o instalador (~105MB) estoura o limite de 100MB/arquivo do plano.
  url: https://ivjvpdzsfjdpyabbzzuj.supabase.co/storage/v1/object/public/kiosk-updates/kiosk
extraMetadata:
  description: FaçaAmigos - AppGestão
directories:
  output: release
  buildResources: build
files:
  - bundle/**
  - package.json
asar: true
npmRebuild: false
extraResources:
  # SPA servida pelo Fastify local (ver src/server/staticSpa.ts)
  - from: ../kiosk-ui/dist
    to: kiosk-ui
  # Migrations .sql lidas em runtime (ver packages/db-local/src/migrate.ts)
  - from: ../../packages/db-local/dist/migrations
    to: migrations
  # Arquivo de configuração .env para o quiosque
  - from: .env
    to: .env

win:
  target:
    - target: nsis
      arch: [x64]
    # appx (MSIX): pacote para a Microsoft Store. Só builda em Windows
    # (electron-builder usa makeappx.exe/makepri.exe, que não existem em
    # Linux/Mac) — use `pnpm dist:kiosk:store` numa máquina/CI Windows.
    - target: appx
      arch: [x64]
  icon: build/icon.ico
  artifactName: FacaAmigos-Setup-${version}.${ext}
# Identidade do pacote MSIX. identityName/publisher têm que ser IDÊNTICOS
# aos valores reservados no Partner Center (Página do produto > Identidade
# do app) — sem isso o `pnpm dist:kiosk:store` builda um pacote que a Store
# rejeita na submissão. Ver passo a passo no fim deste arquivo/README.
appx:
  identityName: SUBSTITUIR_PELO_IDENTITY_NAME_DO_PARTNER_CENTER
  publisher: CN=SUBSTITUIR_PELO_PUBLISHER_ID_DO_PARTNER_CENTER
  publisherDisplayName: SUBSTITUIR_PELO_NOME_DA_PUBLICADORA
  applicationId: FacaAmigosKiosk
  displayName: FaçaAmigos
  backgroundColor: "#F0196B"
  languages:
    - pt-br
  showNameOnTiles: true
  # Sem isto, app.setLoginItemSettings({ openAtLogin: true }) (ver main.ts)
  # não funciona dentro de um pacote MSIX — apps Store não podem se
  # registrar direto no Run do registro; precisam da StartupTask
  # declarada no appxmanifest. Esta flag adiciona a extensão automaticamente.
  addAutoLaunchExtension: true
nsis:
  oneClick: true
  # perMachine + elevação: necessário para o installer.nsh abrir a porta
  # 7317 no firewall (acesso LAN aos tablets) — custa um prompt de UAC.
  perMachine: true
  allowElevation: true
  runAfterFinish: true
  # "always" (não só "true"): "true" só cria o atalho na instalação
  # inicial — nas reinstalações silenciosas do auto-updater ele não é
  # recriado se sumir. Como o quiosque atualiza sozinho sem ninguém
  # conferindo, "always" garante que o atalho da área de trabalho nunca
  # fique perdido. createStartMenuShortcut não aceita "always" nesta
  # versão do electron-builder (só boolean) — fica true.
  createDesktopShortcut: always
  createStartMenuShortcut: true
  include: build/installer.nsh
