# Config do Supabase CLI para o projeto compartilhado `ivjvpdzsfjdpyabbzzuj`
# (mesmo projeto já usado por apps/backoffice — ver apps/backoffice/README.md).
#
# Este projeto NÃO foi criado com `supabase init` neste ambiente porque a CLI
# não está instalada aqui e o link exige credenciais (access token / db
# password) que não devem ser digitadas por um agente automatizado.
#
# Para linkar e aplicar as migrations manualmente:
#   npm install -g supabase
#   supabase login
#   supabase link --project-ref ivjvpdzsfjdpyabbzzuj
#   supabase db pull        # reconcilia com o schema já criado via dashboard
#   supabase db push        # aplica supabase/migrations/*.sql

project_id = "faca-amigos-kiosk"

[db]
major_version = 15

# login-pin e list-employees são chamadas ANTES de existir qualquer sessão
# (tela de login por PIN) — não podem exigir JWT do portão do Supabase.
# As duas fazem sua própria checagem de autorização internamente (PIN
# conferido no servidor / só devolvem id+nome via service role).
[functions.login-pin]
verify_jwt = false

[functions.list-employees]
verify_jwt = false

# Link de convite individual: a pessoa ainda não tem conta/sessão nenhuma
# quando abre o link e preenche o próprio cadastro — mesma razão do
# login-pin acima. A autorização real é o token do convite, conferido no
# servidor em supabase/functions/_shared/onboardingInvite.ts.
# create-onboarding-invite NÃO entra aqui: quem gera o convite já está
# logado como ADMIN, então continua exigindo JWT normalmente.
[functions.onboarding-invite-info]
verify_jwt = false

[functions.onboarding-complete]
verify_jwt = false

# Link Geral de auto-cadastro de estagiário: mesmo espírito acima, mas o
# token é fixo por unidade (ver fa_kiosk_unit_general_invites), conferido em
# supabase/functions/_shared/generalInvite.ts. general-invite-link NÃO
# entra aqui: quem gera/consulta o link já está logado com
# config.employees.write.
[functions.general-invite-info]
verify_jwt = false

[functions.general-onboarding-complete]
verify_jwt = false

# Só o worker fiscal do kiosk chama esta function, com a chave do worker
# (FISCAL_WORKER_SECRET_KEY, formato `sb_secret_...`) — que NÃO é JWT, então
# o portão do Supabase a recusaria. A autorização real é feita dentro da
# function: bearer igual (comparação em tempo constante) à service role key
# ou à chave do worker; nada de sessão de usuário.
[functions.nfse-certificate-fetch]
verify_jwt = false

# Compêndio mensal de vendas (reunião de alinhamento): disparada 1x/dia
# pelo pg_cron/pg_net, nunca por um navegador — mesma razão de
# ponto-photo-retention-dispatch/owner-report-dispatch acima.
[functions.sales-compendium-dispatch]
verify_jwt = false

# Webhook do WhatsApp do CRM: quem chama é a Twilio, que não manda JWT. A
# autorização real é a assinatura X-Twilio-Signature (HMAC-SHA1 com o Auth
# Token da subconta), conferida dentro da function. crm-whatsapp-send NÃO
# entra aqui: quem envia está logado e a function exige 'crm.write'.
[functions.crm-whatsapp-webhook]
verify_jwt = false

# NPS automático pós-visita: disparada só pelo pg_cron/pg_net (a cada 15 min),
# nunca por navegador — mesma razão de sales-compendium-dispatch. Desligada por
# padrão em cada unidade (app_settings crm_nps_auto) e idempotente (janela de
# checkout fixa + cooldown de 30 dias por contato).
[functions.crm-nps-auto-dispatch]
verify_jwt = false

# Campanha de opt-in da base atual (máx. 20/dia, nasce pausada, freio
# automático): disparada só pelo pg_cron de hora em hora, nunca por navegador.
[functions.crm-optin-dispatch]
verify_jwt = false

# Aviso de fim de plano + oferta de renovação por WhatsApp: só o pg_cron/pg_net
# chama (a cada minuto). Desligada por padrão em cada unidade (app_settings
# crm_renewal_alert) e idempotente (fa_crm_renewal_alerts.session_id unique).
[functions.crm-renewal-alert-dispatch]
verify_jwt = false

# Avisos da visita por WhatsApp (boas-vindas, fim do plano, renovação aplicada,
# fidelidade): só o pg_cron/pg_net chama (a cada minuto). Cada tipo desligado por
# padrão em cada unidade (app_settings crm_notify_<tipo>) e idempotente
# (fa_crm_visit_notifications unique por sessão+tipo+ref).
[functions.crm-visit-notify-dispatch]
verify_jwt = false

# Convite ao Mapeamento Comportamental 1 semana após a visita (uma vez por
# responsável): só o pg_cron/pg_net chama (de hora em hora). Desligada por
# padrão em cada unidade (app_settings crm_mapeamento_followup) e idempotente
# (fa_crm_mapeamento_invites.guardian_id unique, gravada antes do envio).
[functions.crm-mapeamento-dispatch]
verify_jwt = false
